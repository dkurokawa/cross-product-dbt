[project]
name = "cross-product-dbt"
version = "0.1.0"
description = "A cross-product data platform template: five differently shaped sources landed, contract-checked, and modelled with dbt on DuckDB (BigQuery-compilable)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    # eventlake is not on PyPI; pinned to a commit.
    "eventlake @ git+https://github.com/dkurokawa/eventlake@9ee5cf6",
    "faker>=30",
    "numpy>=1.26",
    "pandas>=2.2",
    "pandera>=0.20",
    "pyarrow>=16.0.0",
    "pyyaml>=6",
    "duckdb>=1.5.0",
    "dbt-core>=1.10",
    "dbt-duckdb>=1.10",
]

[project.scripts]
platform = "cross_product_platform.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.10",
    "sqlfluff>=3.2",
    "pandas-stubs",
    "types-PyYAML",
    # Only used for `dbt compile --target bigquery` (offline, no connection).
    "dbt-bigquery>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/cross_product_platform"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["duckdb.*", "pyarrow.*", "pandera.*", "faker.*", "eventlake.*", "yaml.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.coverage.run]
source = ["cross_product_platform"]
