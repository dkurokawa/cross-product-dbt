name: platform
version: "0.1.0"
config-version: 2

profile: platform

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]
clean-targets: ["target", "dbt_packages"]

vars:
  # Consumption tax rate in force for the whole synthetic period (used to derive the missing
  # side of a tax-inclusive / tax-exclusive pair).
  consumption_tax_rate: 0.10

models:
  platform:
    bronze:
      +materialized: table
      +schema: bronze
    silver:
      +materialized: table
      +schema: silver

seeds:
  platform:
    +schema: silver
