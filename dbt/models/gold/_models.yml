version: 2
models:
- name: identity_quality
  description: 'Members per identification method and source, including the unmatched (source_local) and
    the number of ambiguous phone+kana links.

    '
  columns:
  - name: source
    data_tests:
    - not_null
    config:
      meta:
        pii: none
  - name: category
    data_tests:
    - accepted_values:
        arguments:
          values:
          - email
          - phone
          - phone_kana
          - source_local
          - ambiguous_link
    config:
      meta:
        pii: none
  - name: n
    data_tests:
    - not_null
    config:
      meta:
        pii: none
- name: ingest_quality_daily
  description: 'Files accepted and quarantined per source, dataset and delivery partition (a day, or a
    month for E). Quarantined files are never silently dropped: they are counted here.

    '
  columns:
  - name: source
    data_tests:
    - not_null
    config:
      meta:
        pii: none
  - name: dataset
    data_tests:
    - not_null
    config:
      meta:
        pii: none
  - name: partition_date
    data_tests:
    - not_null
    config:
      meta:
        pii: none
  - name: files_landed
    config:
      meta:
        pii: none
  - name: rows_landed
    config:
      meta:
        pii: none
  - name: files_quarantined
    config:
      meta:
        pii: none
  - name: violations
    config:
      meta:
        pii: none
  data_tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - source
        - dataset
        - partition_date
- name: audit_access_log
  description: 'One row per query-gateway call (executed or denied): principal (self-declared), role,
    normalized SQL with literals removed, referenced tables and columns, sensitive columns mentioned,
    rows returned or the deny reason. Built after the gateway has written events.'
  columns:
  - name: event_id
    config:
      meta:
        pii: none
    data_tests:
    - unique
    - not_null
  - name: occurred_at
    config:
      meta:
        pii: none
  - name: outcome
    config:
      meta:
        pii: none
    data_tests:
    - accepted_values:
        arguments:
          values:
          - executed
          - denied
    - not_null
  - name: principal
    config:
      meta:
        pii: quasi
  - name: role
    config:
      meta:
        pii: none
  - name: sql_hash
    config:
      meta:
        pii: none
  - name: sql_normalized
    config:
      meta:
        pii: none
  - name: referenced_tables
    config:
      meta:
        pii: none
  - name: referenced_columns
    config:
      meta:
        pii: none
  - name: sensitive_columns
    config:
      meta:
        pii: none
  - name: touched_sensitive
    config:
      meta:
        pii: none
  - name: row_count
    config:
      meta:
        pii: none
  - name: deny_reason
    config:
      meta:
        pii: none
