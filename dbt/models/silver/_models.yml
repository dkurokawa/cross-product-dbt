version: 2
models:
- name: xref_member
  description: Every (source, source member id) mapped to one canonical member_key.
  columns:
  - name: source
    config:
      meta:
        pii: none
  - name: source_member_id
    config:
      meta:
        pii: quasi
  - name: source_member_key
    config:
      meta:
        pii: quasi
  - name: member_key
    data_tests:
    - not_null
    config:
      meta:
        pii: quasi
  - name: link_ambiguous
    config:
      meta:
        pii: none
  data_tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - source
        - source_member_id
- name: dim_member
  description: One row per real person across A-D, with flags for the products they appear in.
  columns:
