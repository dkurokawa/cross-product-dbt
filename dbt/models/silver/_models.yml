    config:
      meta:
        pii: quasi
  - name: key_method
    config:
      meta:
        pii: none
  - name: name
    config:
      meta:
        pii: direct
        mask: initial
  - name: name_kana
    config:
      meta:
        pii: direct
        mask: initial
  - name: email
    config:
      meta:
        pii: direct
        mask: email_domain
  - name: phone
    config:
      meta:
        pii: direct
        mask: phone_last4
  - name: birth_date
    config:
      meta:
        pii: direct
        mask: birth_year
  - name: health_notes
    config:
      meta:
        pii: sensitive
  - name: medical_conditions
    config:
      meta:
        pii: sensitive
  - name: first_seen_at
