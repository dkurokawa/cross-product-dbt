version: 2

# Silver: the shared model. Personal data is present here (dim_member); who may see it is
# decided by later layers.

models:
  - name: xref_member
    description: "Every (source, source member id) mapped to one canonical member_key."
    columns:
      - name: member_key
        data_tests: [not_null]
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [source, source_member_id]

  - name: dim_member
    description: "One row per real person across A-D, with flags for the products they appear in."
    columns:
      - name: member_key
        data_tests: [unique, not_null]
      - name: household_key
        data_tests: [not_null]

  - name: dim_household
    description: "Households: a payer plus the people who use the service."
    columns:
      - name: household_key
        data_tests: [unique, not_null]

  - name: dim_account
    description: "Corporate accounts from the sales sheet (E)."
    columns:
      - name: account_key
        data_tests: [unique, not_null]

  - name: c_member_current
    description: "Latest state per C member; erased members are flagged, not dropped."
    columns:
      - name: member_id
        data_tests: [unique, not_null]

  - name: c_contract_current
    description: "Latest state per contract, either table generation."
    columns:
      - name: contract_id
        data_tests: [unique, not_null]
      - name: plan_ref
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_plan')
                field: plan_ref

  - name: int_c_contract_log
    description: "Both contract table generations in one shape (namespaced plan_ref)."

  - name: scd_contract
    description: "Contract history (SCD2). No-op updates are collapsed; deletes are a final version."
    columns:
      - name: plan_ref
        data_tests:
          # An unmapped plan code must fail the build, not quietly become NULL.
          - relationships:
              arguments:
                to: ref('dim_plan')
                field: plan_ref
      - name: is_current
        data_tests: [not_null]
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [contract_id, valid_from]

  - name: int_member_source_rows
    description: "Current member record per product with the landing-time keys."

  - name: fct_session
    description: "Workouts (A) and gym check-ins (C)."
    columns:
      - name: session_id
        data_tests: [unique, not_null]
      - name: member_key
        data_tests: [not_null]

  - name: fct_booking
    description: "Bookings (B), latest snapshot; tax-exclusive price with the derived tax-inclusive price."
    columns:
      - name: booking_id
        data_tests: [unique, not_null]
      - name: member_key
        data_tests: [not_null]

  - name: fct_payment
    description: >
      Money from A (in-app purchases) and D (invoices, refunds), tax-inclusive, with the amount
      as the source stated it kept in amount_original.
    columns:
      - name: payment_id
        data_tests: [unique, not_null]
      - name: member_key
        data_tests: [not_null]
      - name: payment_type
        data_tests:
          - accepted_values:
              arguments:
                values: [charge, refund]
      - name: plan_ref
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_plan')
                field: plan_ref

  - name: fct_activity
    description: "Union of every activity that counts as a member being active (sessions + attended bookings)."
    columns:
      - name: activity_id
        data_tests: [unique, not_null]
      - name: member_key
        data_tests: [not_null]

  - name: dim_member_product
    description: "One row per (member, product): the products a person is a customer of."
    columns:
      - name: member_key
        data_tests: [not_null]
      - name: product
        data_tests:
          - accepted_values:
              arguments:
                values: [A, B, C, D]
