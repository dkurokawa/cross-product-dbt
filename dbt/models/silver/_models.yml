- name: dim_member_product
  description: 'One row per (member, product): the products a person is a customer of.'
  columns:
  - name: member_key
    data_tests:
    - not_null
    config:
      meta:
        pii: quasi
  - name: product
    data_tests:
    - accepted_values:
        arguments:
          values:
          - A
          - B
          - C
          - D
