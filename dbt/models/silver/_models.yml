- name: fct_payment
  description: 'Money from A (in-app purchases) and D (invoices, refunds), tax-inclusive, with the amount
    as the source stated it kept in amount_original.

    '
  columns:
  - name: payment_id
    data_tests:
    - unique
    - not_null
    config:
      meta:
        pii: none
  - name: source
    config:
      meta:
        pii: none
  - name: payment_type
    data_tests:
    - accepted_values:
        arguments:
          values:
          - charge
          - refund
    config:
      meta:
        pii: none
  - name: member_key
    data_tests:
    - not_null
    config:
      meta:
        pii: quasi
  - name: plan_ref
    data_tests:
