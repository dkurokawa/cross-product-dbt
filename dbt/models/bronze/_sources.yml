version: 2

# Landing-area sources, read in place with DuckDB's table functions (dbt-duckdb
# `external_location`). {{ env_var('PLATFORM_LANDING_ROOT') }} is the lake root written by
# `platform ingest`. On other warehouses these become ordinary tables loaded by a
# separate step, so the models below never mention a table function.
#
# Freshness: every landed file carries `ingested_at` (added by the landing step).

sources:
  - name: a
    description: "Product A: consumer app events, written with eventlake."
    schema: raw_a
    loaded_at_field: ingested_at
    freshness: &freshness
      warn_after: {count: 24, period: hour}
      error_after: {count: 72, period: hour}
    tables:
      - name: member_registered
        config:
          meta:
            external_location: "read_parquet('{{ env_var('PLATFORM_LANDING_ROOT', 'build/lake') }}/A/member_registered/dt=*/part-*.parquet', union_by_name=true, hive_partitioning=true, filename=true)"
        columns:
          - name: event_id
            config:
              meta:
                pii: none
          - name: occurred_at
            config:
              meta:
                pii: none
          - name: recorded_at
            config:
              meta:
                pii: none
          - name: member_id
            config:
              meta:
                pii: quasi
          - name: email
            config:
              meta:
                pii: direct
                mask: email_domain
          - name: name
            config:
              meta:
                pii: direct
                mask: initial
          - name: name_kana
            config:
              meta:
                pii: direct
                mask: initial
          - name: phone
            config:
              meta:
                pii: direct
                mask: phone_last4
          - name: birth_date
            config:
              meta:
                pii: direct
                mask: birth_year
          - name: guardian_member_id
            config:
              meta:
                pii: quasi
          - name: guardian_email
            config:
              meta:
                pii: direct
                mask: email_domain
          - name: health_notes
            config:
              meta:
                pii: sensitive
          - name: member_key
            config:
              meta:
                pii: quasi
          - name: link_key
            config:
              meta:
                pii: quasi
          - name: key_method
            config:
              meta:
                pii: none
          - name: household_key
            config:
              meta:
                pii: quasi
          - name: ingested_at
            config:
              meta:
                pii: none
      - name: app_opened
        config:
          meta:
            external_location: "read_parquet('{{ env_var('PLATFORM_LANDING_ROOT', 'build/lake') }}/A/app_opened/dt=*/part-*.parquet', union_by_name=true, hive_partitioning=true, filename=true)"
        columns:
          - name: event_id
            config:
              meta:
                pii: none
          - name: occurred_at
            config:
              meta:
                pii: none
          - name: recorded_at
            config:
              meta:
                pii: none
          - name: member_id
            config:
              meta:
                pii: quasi
          - name: ingested_at
            config:
              meta:
                pii: none
      - name: workout_completed
        config:
          meta:
            external_location: "read_parquet('{{ env_var('PLATFORM_LANDING_ROOT', 'build/lake') }}/A/workout_completed/dt=*/part-*.parquet', union_by_name=true, hive_partitioning=true, filename=true)"
        columns:
          - name: event_id
            config:
              meta:
                pii: none
          - name: occurred_at
            config:
              meta:
                pii: none
          - name: recorded_at
