version: 2

# Bronze: shape only (types, UTC, encoding). No rows are dropped, except that re-delivered
# eventlake events collapse to one (the eventlake read rule).

models:
  - name: brz_a_member_registered
    description: "A: app account registrations, de-duplicated by event_id (earliest recorded_at wins)."
    columns:
      - name: event_id
        data_tests: [unique, not_null]
      - name: occurred_at
        data_tests: [not_null]
      - name: member_id
        data_tests: [not_null]
      - name: member_key
        data_tests: [not_null]
      - name: key_method
        data_tests:
          - accepted_values:
              arguments:
                values: [email, phone, phone_kana, source_local]

  - name: brz_a_app_opened
    description: "A: app opened, de-duplicated by event_id."
    columns:
      - name: event_id
        data_tests: [unique, not_null]
      - name: member_id
        data_tests: [not_null]
    data_tests:
      # A one-day hole in the daily series is a broken delivery, not a quiet day.
      - row_count_anomaly:
          arguments:
            date_column: occurred_at
            window: 28
            z: 3

  - name: brz_a_workout_completed
    description: "A: workouts logged in the app, de-duplicated by event_id."
    columns:
      - name: event_id
        data_tests: [unique, not_null]
      - name: member_id
        data_tests: [not_null]
    data_tests:
      - row_count_anomaly:
          arguments:
            date_column: occurred_at
            window: 28
            z: 3

  - name: brz_a_purchase_made
    description: "A: in-app purchases (tax-inclusive), de-duplicated by event_id."
    columns:
      - name: event_id
        data_tests: [unique, not_null]
      - name: amount_tax_incl
        data_tests: [not_null]

  - name: brz_b_customers
    description: "B: customers per delivered snapshot; created_at / deleted_at converted from Tokyo time to UTC."
    columns:
      - name: member_key
        data_tests: [not_null]
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [tenant_id, member_no, snapshot_date]

  - name: brz_b_bookings
    description: "B: bookings per delivered snapshot (tax-exclusive prices, times converted to UTC)."
    columns:
      - name: status
        data_tests:
          - accepted_values:
              arguments:
                values: [booked, attended, cancelled, no_show]
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [tenant_id, booking_no, snapshot_date]

  - name: brz_c_members
    description: "C: members CDC log as delivered."
    columns:
      - name: op
        data_tests:
          - accepted_values:
              arguments:
                values: ["I", "U", "D"]
      - name: lsn
        data_tests: [unique, not_null]

  - name: brz_c_contracts_fy2025
    description: "C: first-generation contract table, CDC log as delivered."
    columns:
      - name: lsn
        data_tests: [unique, not_null]

  - name: brz_c_contracts_fy2026
    description: "C: second-generation contract table, CDC log as delivered."
    columns:
      - name: lsn
        data_tests: [unique, not_null]

  - name: brz_c_visits
    description: "C: check-ins, CDC log as delivered."
    columns:
      - name: lsn
        data_tests: [unique, not_null]

  - name: brz_d_invoices
    description: "D: invoices with English column names, ISO dates and real types."
    columns:
      - name: invoice_no
        data_tests: [unique, not_null]
      - name: invoice_date
        data_tests: [not_null]
      - name: amount_ex_tax
        data_tests: [not_null]
      - name: tax_rate
        data_tests: [not_null]
      - name: member_key
        data_tests: [not_null]

  - name: brz_d_refunds
    description: "D: refunds; each points at an invoice."
    columns:
      - name: refund_no
        data_tests: [unique, not_null]
      - name: invoice_no
        data_tests:
          - relationships:
              arguments:
                to: ref('brz_d_invoices')
                field: invoice_no
      - name: refund_date
        data_tests: [not_null]

  - name: brz_e_accounts
    description: "E: monthly sales-sheet rows; placeholders ('—') are NULL, full-width digits normalized."
    columns:
      - name: account_key
        data_tests: [not_null]
      - name: contract_status
        data_tests:
          - accepted_values:
              arguments:
                values: ["契約中", "解約"]
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [account_key, report_month]

  - name: brz_reported_kpis
    description: "KPIs each product reports about itself."
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [product, reported_as, period_month]

  - name: brz_identity_stats
    description: "Members per key method and source; source_local means unmatched."

  - name: brz_quarantine_log
    description: "Files quarantined by the landing step."

  - name: brz_landing_log
    description: "Files and rows accepted by the landing step per partition."

  - name: brz_audit_query_executed
    description: "Gateway audit events for queries that ran, de-duplicated by event_id (earliest recorded_at wins)."
    columns:
      - name: event_id
        data_tests: [unique, not_null]
  - name: brz_audit_query_denied
    description: "Gateway audit events for refused queries, de-duplicated by event_id."
    columns:
      - name: event_id
        data_tests: [unique, not_null]
