# The single source for who may see what (design decisions F4, F5).
#
# `platform access generate` turns this into
#   * dbt/models/access/acc_<role>__<table>.sql   one table per role and table, the ONLY thing
#                                                  a user is ever pointed at,
#   * dbt/models/access/_access.yml               their documentation and pii classes,
#   * policies/gateway_allowlist.json             the tables and columns the query gateway
#                                                  may let each role read.
# Never edit the generated files. CI regenerates and fails on any difference.
#
# Order of protection (F4): hide -> show masked -> copy.
#   sensitive  never appears for a role with `sensitive: exclude`;
#   direct     is masked (mask kind declared in dbt as meta.mask) for `direct: mask` roles,
#              e-mail -> domain only, phone -> last 4 digits, birth date -> year only,
#              name -> first character only;
#   quasi/none are passed through.
version: 1

roles:
  analyst:
    description: All products; masked personal data; no sensitive columns.
    products: all
    sensitive: exclude
    direct: mask
  product_a: {keys: pseudonym, description: Only what product A itself knows (its rows, its own attributes); masked; no sensitive columns., products: [A], sensitive: exclude, direct: mask}
  product_b: {keys: pseudonym, description: Only what product B itself knows (its rows, its own attributes); masked; no sensitive columns., products: [B], sensitive: exclude, direct: mask}
  product_c: {keys: pseudonym, description: Only what product C itself knows (its rows, its own attributes); masked; no sensitive columns., products: [C], sensitive: exclude, direct: mask}
  product_d: {keys: pseudonym, description: Only what product D itself knows (its rows, its own attributes); masked; no sensitive columns., products: [D], sensitive: exclude, direct: mask}
  product_e: {keys: pseudonym, description: Only what product E itself knows (its rows, its own attributes); masked; no sensitive columns., products: [E], sensitive: exclude, direct: mask}
  privacy_officer:
    description: Audit role. Everything, including sensitive columns and unmasked personal data.
    products: all
    sensitive: include
    direct: clear

# Optional per table: `as` (the name the role sees), `audience` (all | cross_product | product),
# `products` (only these product roles), `roles` (only these roles).
# row_scope decides what a product role may see of a table:
#   none    no product dimension: every role that gets the table sees all its rows
#   flags   one boolean column per product (`columns`): rows where the role's flag is true
#   column  a column that holds the product: rows where it equals the role's product
#   fixed   the table belongs to one product: only that product's role gets it
tables:
  # Roles with `keys: pseudonym` never see a canonical member_key or household_key: every key
# column is replaced by a pseudonym scoped to the role's product, so product roles cannot compare
# notes (and a derived-hash id such as D's source_member_id is dropped for that product).
# The cross-product person and household tables go only to roles that see every product.
  # Product roles get, under the same names, tables built from their own product's records alone
  # (no attribute coalesced from another product, no cross-product flags or counts).
  - {name: dim_member, layer: silver, audience: cross_product, row_scope: {kind: none}}
  - {name: dim_member_by_product, as: dim_member, layer: silver, audience: product, products: [A, B, C, D], row_scope: {kind: column, column: product}}
  - {name: dim_household, layer: silver, audience: cross_product, row_scope: {kind: none}}
  - {name: dim_household_by_product, as: dim_household, layer: silver, audience: product, products: [A, B, C, D], row_scope: {kind: column, column: product}}
  - {name: dim_account, layer: silver, row_scope: {kind: fixed, product: E}}
  # Plan codes exist only for C and D: those product roles get their own codes, the others none.
  - {name: dim_plan, layer: silver, products: [C, D], row_scope: {kind: column, column: source}}
  - {name: fct_session, layer: silver, row_scope: {kind: column, column: source}}
  - {name: fct_booking, layer: silver, row_scope: {kind: fixed, product: B}}
  - {name: fct_payment, layer: silver, row_scope: {kind: column, column: source}}
  - {name: fct_activity, layer: silver, row_scope: {kind: column, column: source}}
  - {name: scd_contract, layer: silver, row_scope: {kind: fixed, product: C}}
  # The audit log of the gateway: only the privacy officer reads it (and reading it is audited
  # like any other query). Tagged `audit` so it is rebuilt after the gateway has written events.
  - {name: audit_access_log, layer: gold, roles: [privacy_officer], tags: [audit], row_scope: {kind: none}}
  - {name: identity_quality, layer: gold, row_scope: {kind: column, column: source}}
  - {name: ingest_quality_daily, layer: gold, row_scope: {kind: column, column: source}}

# Every generated metric_* and recon_* model (from metrics/metrics.yml) is exposed too, scoped by
# its `product` column.
generated_metrics:
  row_scope: {kind: column, column: product}
